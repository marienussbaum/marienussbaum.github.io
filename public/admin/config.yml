# Sveltia CMS — interface d'édition à l'adresse /admin
# base_url = le worker Cloudflare qui gère la connexion GitHub
# (déployé le 30/08/2026 ; source dans ../../cms-auth-worker)
backend:
  name: github
  repo: marienussbaum/marienussbaum.github.io
  branch: master
  base_url: https://sveltia-cms-auth.marienussbaum.workers.dev

media_folder: public/images
public_folder: /images

i18n:
  structure: multiple_folders
  locales: [fr, en]
  default_locale: fr

collections:
  - name: carnets-fr
    label: Carnets (français)
    label_singular: Carnet (FR)
    folder: src/content/blog/fr
    create: true
    extension: md
    slug: "{{fields.slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: description, label: "Description (Google, ~155 caractères)", widget: text }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { name: image, label: Image de couverture, widget: image, required: false }
      - { name: imageAlt, label: "Texte alternatif de l'image", widget: string, required: false }
      - name: categories
        label: Rubriques
        widget: select
        multiple: true
        options:
          - { label: "Enfance & parentalité", value: enfance-et-parentalite }
          - { label: "Adolescents", value: adolescents }
          - { label: "Couple & liens", value: couple-et-liens }
          - { label: "HPI & douance", value: hpi-et-douance }
          - { label: "Travail & burn-out", value: travail-et-burn-out }
          - { label: "Corps & maladie", value: corps-et-maladie }
          - { label: "Deuil & grand âge", value: deuil-et-grand-age }
          - { label: "Insolites", value: insolites }
          - { label: "Psychanalyse & société", value: psychanalyse-et-societe }
          - { label: "Expatriation & vies internationales", value: expatriation }
      - { name: lang, label: Langue, widget: hidden, default: fr }
      - { name: slug, label: "Adresse (slug — ne pas modifier après publication)", widget: string }
      - { name: translation, label: "Adresse de la version anglaise", widget: string, required: false, hint: "ex. /en/blog/mon-article/" }
      - { name: featured, label: "Mis en avant (accueil + « Par où commencer »)", widget: boolean, default: false, required: false }
      - { name: body, label: Texte, widget: markdown }
  - name: carnets-en
    label: Notebooks (English)
    label_singular: Notebook (EN)
    folder: src/content/blog/en
    create: true
    extension: md
    slug: "{{fields.slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: "Description (Google, ~155 characters)", widget: text }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { name: image, label: Cover image, widget: image, required: false }
      - { name: imageAlt, label: "Image alt text", widget: string, required: false }
      - name: categories
        label: Sections
        widget: select
        multiple: true
        options:
          - { label: "Childhood & parenthood", value: childhood-and-parenthood }
          - { label: "Adolescence", value: adolescence }
          - { label: "Couples & bonds", value: couples-and-bonds }
          - { label: "Giftedness", value: giftedness }
          - { label: "Work & burnout", value: work-and-burnout }
          - { label: "Body & illness", value: body-and-illness }
          - { label: "Grief & old age", value: grief-and-old-age }
          - { label: "Curiosities", value: curiosities }
          - { label: "Psychoanalysis & society", value: psychoanalysis-and-society }
          - { label: "Expat & international lives", value: expat-lives }
      - { name: lang, label: Language, widget: hidden, default: en }
      - { name: slug, label: "URL slug (do not change after publishing)", widget: string }
      - { name: translation, label: "French version path", widget: string, required: false, hint: "e.g. /fr/blog/mon-article/" }
      - { name: featured, label: "Featured (homepage + “Where to begin”)", widget: boolean, default: false, required: false }
      - { name: body, label: Body, widget: markdown }

  - name: pages
    label: Textes du site
    # Les pages fixes : on peut y reformuler les phrases et changer les photos,
    # sans toucher a la structure du site.
    files:
      - name: home-fr
        label: "Accueil — version française"
        file: src/data/home.fr.json
        fields:
          # ── Référencement (ce que Google affiche) ──
          - { name: title, label: "Titre dans l’onglet et dans Google", widget: string, hint: "Environ 60 caractères." }
          - { name: desc, label: "Résumé affiché sous le titre dans Google", widget: text, hint: "Environ 155 caractères." }
          # ── Haut de page ──
          - { name: sur, label: "Surtitre, au-dessus du grand titre", widget: string }
          - { name: h1, label: "Grand titre", widget: string }
          - { name: lead, label: "Phrase d’introduction", widget: text }
          - { name: rdv, label: "Bouton — prendre rendez-vous", widget: string }
          - { name: decouvrir, label: "Bouton — découvrir l’approche", widget: string }
          - name: assur
            label: "Les trois mentions rassurantes"
            widget: list
            field: { name: item, label: "Ligne", widget: string }
          - { name: photo, label: "Photo de Marie", widget: image }
          - { name: photoAlt, label: "Description de la photo (pour les non-voyants et Google)", widget: string }
          - { name: pill, label: "Mention sous la photo", widget: string }
          # ── Pour qui — les quatre publics ──
          - { name: quiCaps, label: "Petit intitulé de section", widget: string }
          - { name: quiH2, label: "Titre de section", widget: string }
          - name: qui
            label: "Les quatre publics"
            widget: list
            hint: "Vous pouvez réécrire chaque bloc, en ajouter ou en retirer."
            fields:
              - { name: titre, label: "Titre", widget: string }
              - { name: texte, label: "Texte", widget: text }
          - { name: avantHtml, label: "Le bandeau « Avant la clinique… »", widget: text, hint: "Le texte entre <b> et </b> s’affiche en gras. Ne pas supprimer ces balises si vous voulez garder l’effet." }
          # ── L’approche ──
          - { name: apprCaps, label: "Petit intitulé de section", widget: string }
          - { name: apprH2, label: "Titre de section", widget: string }
          - name: appr
            label: "Les paragraphes de l’approche"
            widget: list
            hint: "Le texte entre <b> et </b> s’affiche en gras. Ne pas supprimer ces balises si vous voulez garder l’effet."
            field: { name: item, label: "Paragraphe", widget: text }
          - { name: exergue, label: "La phrase mise en exergue", widget: text }
          # ── La visio ──
          - { name: visioCaps, label: "Petit intitulé de section", widget: string }
          - { name: visioH2, label: "Titre de section", widget: string }
          - { name: visioP, label: "Paragraphe", widget: text, hint: "Le texte entre <b> et </b> s’affiche en gras. Ne pas supprimer ces balises si vous voulez garder l’effet." }
          - name: visioPts
            label: "Les trois points"
            widget: list
            field: { name: item, label: "Ligne", widget: string }
          - { name: visioImage, label: "Illustration", widget: image }
          - { name: visioAlt, label: "Description de l’illustration", widget: string }
          # ── Le cabinet ──
          - { name: cabCaps, label: "Petit intitulé de section", widget: string }
          - { name: cabH2, label: "Titre de section", widget: string }
          - { name: cabP, label: "Paragraphe", widget: text }
          - { name: cabImage, label: "Photo du cabinet", widget: image }
          - { name: cabAlt, label: "Description de la photo", widget: string }
          - { name: adresse, label: "Libellé « Adresse »", widget: string }
          - { name: metro, label: "Libellé « Métro »", widget: string }
          - { name: langues, label: "Libellé « Langues »", widget: string }
          - { name: languesNote, label: "Note sous les langues", widget: string }
          - { name: hono, label: "Libellé « Honoraires »", widget: string }
          - { name: honoEn, label: "Mention « en anglais »", widget: string }
          - { name: honoNote, label: "Note sous les honoraires", widget: string }
          # ── Les carnets ──
          - { name: carnetsCaps, label: "Petit intitulé de section", widget: string }
          - { name: carnetsH2, label: "Titre de section", widget: string }
          - { name: carnetsP, label: "Phrase de présentation", widget: string, hint: "Gardez {count} : il est remplacé automatiquement par le nombre de textes publiés." }
          - { name: tous, label: "Bouton — tous les carnets", widget: string }
          # ── Bas de page ──
          - { name: finalH2, label: "Titre final", widget: string }
          - { name: finalP, label: "Paragraphe final", widget: text }
          - { name: reserver, label: "Bouton — réserver", widget: string }
          - { name: tel, label: "Libellé « Téléphone »", widget: string }
          - { name: cab, label: "Libellé « Cabinet »", widget: string }
          - { name: visioLbl, label: "Libellé « Visio »", widget: string }
          - { name: visioVal, label: "Valeur en face de « Visio »", widget: string }
